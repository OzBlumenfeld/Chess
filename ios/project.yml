name: ChessAnalyzer
options:
  bundleIdPrefix: com.ozblumenfeld
  deploymentTarget:
    iOS: "17.0"
packages:
  ChessCore:
    path: ChessCore
targets:
  ChessAnalyzer:
    type: application
    platform: iOS
    sources: [ChessAnalyzer]
    dependencies:
      - package: ChessCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Chess Analyzer
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  ChessAnalyzerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ChessAnalyzerUITests]
    dependencies:
      - target: ChessAnalyzer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
schemes:
  ChessAnalyzer:
    build:
      targets:
        ChessAnalyzer: all
        ChessAnalyzerUITests: [test]
    test:
      targets: [ChessAnalyzerUITests]
